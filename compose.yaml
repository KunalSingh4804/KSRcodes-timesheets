services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: multiverse
      POSTGRES_USER: multiverse
      POSTGRES_PASSWORD: ${LOCAL_DATABASE_PASSWORD:?Set LOCAL_DATABASE_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U multiverse -d multiverse"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  postgres-data:
